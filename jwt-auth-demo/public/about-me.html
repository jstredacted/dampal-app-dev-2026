<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Me</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    a, button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    nav { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1.5rem 0; }
    dl { display: grid; grid-template-columns: 8rem 1fr; gap: .8rem 1rem; }
    dt { font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; }
    #message { color: #b00020; }
  </style>
</head>
<body>
  <p id="message" role="status"></p>
  <h1>About Me</h1>
  <dl>
    <dt>Username</dt><dd id="username">Loading...</dd>
    <dt>Email</dt><dd id="email"></dd>
    <dt>Bio</dt><dd id="bio"></dd>
  </dl>
  <nav aria-label="Protected pages">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/users.html">Users</a>
    <button id="logout" type="button">Log out</button>
  </nav>
  <script>
    const token = localStorage.getItem("token");
    const message = document.getElementById("message");

    function redirectToLogin() {
      localStorage.removeItem("token");
      window.location.href = "/index.html";
    }

    async function loadAboutMe() {
      if (!token) return redirectToLogin();
      try {
        const response = await fetch("/api/users/me", {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (response.status === 401) return redirectToLogin();
        if (!response.ok) {
          message.textContent = "Could not load your profile. Please try again.";
          return;
        }

        const user = await response.json();
        document.getElementById("username").textContent = user.username;
        document.getElementById("email").textContent = user.email;
        document.getElementById("bio").textContent = user.bio || "No bio provided.";
      } catch {
        message.textContent = "Could not connect to the server. Please try again.";
      }
    }

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/index.html";
    });

    loadAboutMe();
  </script>
</body>
</html>
