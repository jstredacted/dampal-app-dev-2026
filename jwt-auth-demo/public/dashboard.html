<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    nav { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1.5rem 0; }
    a, button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    a { color: inherit; }
    #details, #bio { margin: .45rem 0; }
    p { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1 id="greeting">Loading...</h1>
  <p id="message" role="status"></p>
  <p id="details"></p>
  <p id="bio"></p>
  <nav aria-label="Protected pages">
    <a href="/about-me.html">About Me</a>
    <a href="/users.html">Users</a>
  </nav>
  <button id="logout">Log out</button>

  <script>
    const token = localStorage.getItem("token");
    async function loadProfile() {
      if (!token) {
        window.location.href = "/index.html";
        return;
      }
      try {
        const res = await fetch("/api/users/me", {
          headers: { Authorization: `Bearer ${token}` }, // send the token on every protected request
        });

        if (res.status === 401) {
          localStorage.removeItem("token"); // expired or invalid
          window.location.href = "/index.html";
          return;
        }
        if (!res.ok) {
          document.getElementById("message").textContent = "Could not load your profile. Please try again.";
          return;
        }

        const user = await res.json();
        document.getElementById("greeting").textContent = `Hello, ${user.username}`;
        document.getElementById("details").textContent = `Signed in as ${user.email}`;
        document.getElementById("bio").textContent = user.bio || "No bio provided.";
      } catch {
        document.getElementById("message").textContent = "Could not connect to the server. Please try again.";
      }
    }

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token"); // logging out = throwing the token away
      window.location.href = "/index.html";
    });

    loadProfile();
  </script>
</body>
</html>
