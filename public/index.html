<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | User Authentication</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="page">
    <header>
      <p class="site-name">User Authentication</p>
      <h1>Create an account</h1>
      <p>Enter your details to get started.</p>
    </header>

    <form id="auth-form" action="/api/signup" method="post" novalidate>
      <p class="form-note">All fields are required.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
      </div>
      <button id="submit-button" type="submit">Sign up</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <p>Already have an account? <a href="login.html">Log in</a></p>
    <noscript>Please enable JavaScript to submit this form and see the API response.</noscript>
  </main>
</body>
</html>
